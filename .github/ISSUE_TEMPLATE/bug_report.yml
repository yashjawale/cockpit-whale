name: Bug report
description: Report a problem with Cockpit Whale
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please check for an existing issue before submitting. Include enough detail to reproduce the problem, and remove any sensitive information from logs.
  - type: input
    id: version
    attributes:
      label: Cockpit Whale version
      description: Include the version and how you installed it, if known.
      placeholder: "e.g. 1.2.3, Fedora COPR"
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system/version, browser, and Docker version.
      placeholder: "e.g. Fedora 44, Firefox, Docker Engine 28"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the steps that reproduce the issue.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: What happened instead? Include relevant logs or screenshots.
    validations:
      required: true
